name: PL9 - Public Windows runner (private source)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/pl9-public-windows-launch.yml'

permissions:
  contents: read
  statuses: write

jobs:
  pl9:
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Obtain private PL9 release files without publishing binaries
        env:
          GH_TOKEN: ${{ secrets.LOKPA_PRIVATE_REPO_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:GH_TOKEN) { throw 'LOKPA_PRIVATE_REPO_TOKEN is not configured on the public runner.' }
          $dest = Join-Path $env:RUNNER_TEMP 'pl9-parts'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $downloadOk = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            gh release download pl9-package-v1 -R zinevichroman-cpu/lokpa-original-test -D $dest --pattern 'Parasharas_Light_9_RU.zip.*' --clobber
            $downloadExit = $LASTEXITCODE
            if ($downloadExit -eq 0) { $downloadOk = $true; break }
            Write-Host "PL9_RELEASE_DOWNLOAD_RETRY=$attempt EXIT=$downloadExit"
            if ($attempt -lt 3) { Start-Sleep -Seconds 4 }
          }
          if (-not $downloadOk) { throw 'PL9 private release download failed after three attempts.' }
          $lengths = @(73400320,73400320,73400320,73400320,25512863)
          foreach ($i in 1..5) {
            $file = Join-Path $dest ('Parasharas_Light_9_RU.zip.{0:000}' -f $i)
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "PL9 release part missing: $i" }
            $len = (Get-Item -LiteralPath $file).Length
            if ($len -ne $lengths[$i-1]) { throw "PL9 part $i size mismatch: $len" }
          }
          "PL9_PARTS=$dest" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host 'PL9 5 private release parts downloaded and length-verified.'

      - name: Assemble archive and verify SHA256
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'Parasharas_Light_9_RU_JOINED.zip'
          $writer = [System.IO.File]::Create($archive)
          try {
            foreach ($i in 1..5) {
              $path = Join-Path $env:PL9_PARTS ('Parasharas_Light_9_RU.zip.{0:000}' -f $i)
              $reader = [System.IO.File]::OpenRead($path)
              try { $reader.CopyTo($writer) } finally { $reader.Dispose() }
            }
          } finally { $writer.Dispose() }
          $size = (Get-Item -LiteralPath $archive).Length
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($size -ne 319114143 -or $hash -ne '4483ae94c87dcc73e332b2bffd2874b56548a28c077dc16b3269745e5f1e7ce4') { throw "PL9 ZIP integrity failure: size=$size hash=$hash" }
          Write-Host "PL9 ZIP integrity pass: $size bytes, SHA256 $hash"
          "PL9_ZIP=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Extract and verify PL9.exe
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = Join-Path $env:RUNNER_TEMP 'pl9-unpacked'
          Expand-Archive -LiteralPath $env:PL9_ZIP -DestinationPath $dest -Force
          $exe = Join-Path $dest 'GeoVision\PL9\PL9.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'PL9.exe not found in original layout.' }
          $size=(Get-Item -LiteralPath $exe).Length
          $hash=(Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($size -ne 17408000 -or $hash -ne '8868694b4711434b05eb02a341efc770ab2850c417276a282b7673881a5be367') { throw "PL9.exe hash/size failure: $size $hash" }
          $sign=(Get-AuthenticodeSignature -LiteralPath $exe).Status
          Write-Host "PL9 executable verified: size=$size SHA256=$hash Authenticode=$sign"
          "PL9_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Launch real PL9.exe on Windows and inspect top-level window and Win32 controls
        if: false # Already verified in earlier runs; skip redundant blank-chart probe.
        run: |
          $ErrorActionPreference = 'Stop'
          $code = @'
          using System;
          using System.Text;
          using System.Collections.Generic;
          using System.Runtime.InteropServices;
          [ComImport, Guid("618736E0-3C3D-11CF-810C-00AA00389B71"), InterfaceType(ComInterfaceType.InterfaceIsDual)]
          public interface Pl9IAccessible {
            [DispId(-5000)] object get_accParent();
            [DispId(-5001)] int get_accChildCount();
            [DispId(-5002)] [return: MarshalAs(UnmanagedType.IDispatch)] object get_accChild([In, MarshalAs(UnmanagedType.Struct)] object child);
            [DispId(-5003)] [return: MarshalAs(UnmanagedType.BStr)] string get_accName([In, MarshalAs(UnmanagedType.Struct)] object child);
            [DispId(-5004)] [return: MarshalAs(UnmanagedType.BStr)] string get_accValue([In, MarshalAs(UnmanagedType.Struct)] object child);
            [DispId(-5005)] [return: MarshalAs(UnmanagedType.BStr)] string get_accDescription([In, MarshalAs(UnmanagedType.Struct)] object child);
            [DispId(-5006)] [return: MarshalAs(UnmanagedType.Struct)] object get_accRole([In, MarshalAs(UnmanagedType.Struct)] object child);
            [DispId(-5007)] [return: MarshalAs(UnmanagedType.Struct)] object get_accState([In, MarshalAs(UnmanagedType.Struct)] object child);
            [DispId(-5008)] [return: MarshalAs(UnmanagedType.BStr)] string get_accHelp([In, MarshalAs(UnmanagedType.Struct)] object child);
            [DispId(-5009)] int get_accHelpTopic([Out, MarshalAs(UnmanagedType.BStr)] out string helpFile, [In, MarshalAs(UnmanagedType.Struct)] object child);
            [DispId(-5010)] [return: MarshalAs(UnmanagedType.BStr)] string get_accKeyboardShortcut([In, MarshalAs(UnmanagedType.Struct)] object child);
            [DispId(-5011)] [return: MarshalAs(UnmanagedType.Struct)] object get_accFocus();
            [DispId(-5012)] [return: MarshalAs(UnmanagedType.Struct)] object get_accSelection();
            [DispId(-5013)] [return: MarshalAs(UnmanagedType.BStr)] string get_accDefaultAction([In, MarshalAs(UnmanagedType.Struct)] object child);
            [DispId(-5014)] void accSelect(int flags, [In, MarshalAs(UnmanagedType.Struct)] object child);
            [DispId(-5015)] void accLocation(out int left, out int top, out int width, out int height, [In, MarshalAs(UnmanagedType.Struct)] object child);
            [DispId(-5016)] [return: MarshalAs(UnmanagedType.Struct)] object accNavigate(int direction, [In, MarshalAs(UnmanagedType.Struct)] object start);
            [DispId(-5017)] [return: MarshalAs(UnmanagedType.Struct)] object accHitTest(int x, int y);
            [DispId(-5018)] void accDoDefaultAction([In, MarshalAs(UnmanagedType.Struct)] object child);
            [DispId(-5003)] void set_accName([In, MarshalAs(UnmanagedType.Struct)] object child, [In, MarshalAs(UnmanagedType.BStr)] string name);
            [DispId(-5004)] void set_accValue([In, MarshalAs(UnmanagedType.Struct)] object child, [In, MarshalAs(UnmanagedType.BStr)] string value);
          }
          [StructLayout(LayoutKind.Sequential)]
          public struct Pl9KeyboardInput {
            public ushort wVk; public ushort wScan; public uint dwFlags; public uint time; public UIntPtr dwExtraInfo;
          }
          [StructLayout(LayoutKind.Sequential)]
          public struct Pl9MouseInput {
            public int dx; public int dy; public uint mouseData; public uint dwFlags; public uint time; public UIntPtr dwExtraInfo;
          }
          [StructLayout(LayoutKind.Explicit)]
          public struct Pl9InputUnion {
            [FieldOffset(0)] public Pl9KeyboardInput ki;
            [FieldOffset(0)] public Pl9MouseInput mi;
          }
          [StructLayout(LayoutKind.Sequential)]
          public struct Pl9Input {
            public uint type;
            public Pl9InputUnion U;
          }
          [StructLayout(LayoutKind.Sequential)]
          public struct Pl9Rect { public int Left; public int Top; public int Right; public int Bottom; }
          public class Pl9WindowsProbe {
            public delegate bool WindowEnumerator(IntPtr hwnd, IntPtr lparam);
            [DllImport("user32.dll")] public static extern bool EnumChildWindows(IntPtr hwnd, WindowEnumerator cb, IntPtr p);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetClassNameW(IntPtr hwnd, StringBuilder b, int max);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetWindowTextW(IntPtr hwnd, StringBuilder b, int max);
            [DllImport("user32.dll")] public static extern IntPtr GetMenu(IntPtr hwnd);
            [DllImport("user32.dll")] public static extern int GetMenuItemCount(IntPtr menu);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hwnd);
            [DllImport("user32.dll")] public static extern IntPtr GetForegroundWindow();
            [DllImport("user32.dll")]
            public static extern bool GetWindowRect(IntPtr hwnd, out Pl9Rect rect);
            [DllImport("user32.dll", SetLastError=true)]
            public static extern uint SendInput(uint count, [In] Pl9Input[] inputs, int size);
            private static Pl9Input KeyInput(ushort key, uint flags) {
              var input=new Pl9Input();
              input.type=1;
              input.U.ki.wVk=key;
              input.U.ki.wScan=0;
              input.U.ki.dwFlags=flags;
              input.U.ki.time=0;
              input.U.ki.dwExtraInfo=UIntPtr.Zero;
              return input;
            }
            public static uint SendAltF() {
              var inputs=new Pl9Input[] { KeyInput(0x12,0), KeyInput(0x46,0), KeyInput(0x46,2), KeyInput(0x12,2) };
              return SendInput((uint)inputs.Length,inputs,Marshal.SizeOf(typeof(Pl9Input)));
            }
            public static uint SendEnter() {
              var inputs=new Pl9Input[] { KeyInput(0x0D,0), KeyInput(0x0D,2) };
              return SendInput((uint)inputs.Length,inputs,Marshal.SizeOf(typeof(Pl9Input)));
            }
            public static uint SendKey(ushort key) {
              var inputs=new Pl9Input[] { KeyInput(key,0), KeyInput(key,2) };
              return SendInput((uint)inputs.Length,inputs,Marshal.SizeOf(typeof(Pl9Input)));
            }
            public static uint SendTestName() {
              string sample="TEST_CHART_INPUT";
              var inputs=new List<Pl9Input>();
              foreach(char ch in sample) {
                var press=new Pl9Input(); press.type=1; press.U.ki.wScan=(ushort)ch; press.U.ki.dwFlags=4;
                var release=press; release.U.ki.dwFlags=6;
                inputs.Add(press); inputs.Add(release);
              }
              return SendInput((uint)inputs.Count,inputs.ToArray(),Marshal.SizeOf(typeof(Pl9Input)));
            }
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int x,int y);
            public static uint ClickAt(int x,int y) {
              if(!SetCursorPos(x,y)) return 0;
              var down=new Pl9Input(); down.type=0; down.U.mi.dwFlags=2;
              var up=new Pl9Input(); up.type=0; up.U.mi.dwFlags=4;
              return SendInput(2,new Pl9Input[]{down,up},Marshal.SizeOf(typeof(Pl9Input)));
            }
            public static uint ReplaceWithSyntheticDate() {
              var inputs=new List<Pl9Input>();
              inputs.Add(KeyInput(0x11,0)); inputs.Add(KeyInput(0x41,0));
              inputs.Add(KeyInput(0x41,2)); inputs.Add(KeyInput(0x11,2));
              foreach(char ch in "1 Jan 2000") {
                var press=new Pl9Input(); press.type=1; press.U.ki.wScan=(ushort)ch; press.U.ki.dwFlags=4;
                var release=press; release.U.ki.dwFlags=6;
                inputs.Add(press); inputs.Add(release);
              }
              return SendInput((uint)inputs.Count,inputs.ToArray(),Marshal.SizeOf(typeof(Pl9Input)));
            }
            public static uint ReplaceWithSyntheticTime() {
              var inputs=new List<Pl9Input>();
              inputs.Add(KeyInput(0x11,0)); inputs.Add(KeyInput(0x41,0));
              inputs.Add(KeyInput(0x41,2)); inputs.Add(KeyInput(0x11,2));
              foreach(char ch in "12:34:56") {
                var press=new Pl9Input(); press.type=1; press.U.ki.wScan=(ushort)ch; press.U.ki.dwFlags=4;
                var release=press; release.U.ki.dwFlags=6;
                inputs.Add(press); inputs.Add(release);
              }
              return SendInput((uint)inputs.Count,inputs.ToArray(),Marshal.SizeOf(typeof(Pl9Input)));
            }
            [DllImport("oleacc.dll", PreserveSig=true)]
            public static extern int AccessibleObjectFromWindow(IntPtr hwnd, uint objectId, ref Guid riid, [MarshalAs(UnmanagedType.Interface)] out Pl9IAccessible accessible);
            [DllImport("user32.dll")] public static extern bool EnumWindows(WindowEnumerator cb, IntPtr p);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr hwnd, out uint pid);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr hwnd);
            public static string Info(IntPtr hwnd) {
              var a=new StringBuilder(256); var b=new StringBuilder(256);
              GetClassNameW(hwnd,a,a.Capacity); GetWindowTextW(hwnd,b,b.Capacity);
              return "class="+a.ToString()+" text="+b.ToString();
            }
          }
          '@
          Add-Type -TypeDefinition $code -ErrorAction Stop
          $exe=$env:PL9_EXE
          $wd=Split-Path -Parent $exe
          $env:QT_ACCESSIBILITY = '1'
          $env:QT_USE_NATIVE_WINDOWS = '1'
          $proc=$null
          $result=[ordered]@{ engine='Parasharas Light 9'; executable_verified=$true; process_started=$false; process_alive_after_15s=$false; process_id=$null; window_handle=$null; window_title=$null; window_class=$null; child_count=0; root_menu_present=$false; root_menu_items=0; calculations_verified=$false; export_verified=$false; error=$null }
          try {
            $proc=Start-Process -FilePath $exe -WorkingDirectory $wd -PassThru -ErrorAction Stop
            $result.process_started=$true
            $result.process_id=$proc.Id
            Start-Sleep -Seconds 15
            $proc.Refresh()
            $result.process_alive_after_15s= -not $proc.HasExited
            if (-not $result.process_alive_after_15s) { throw "PL9.exe exited before 15 seconds; exit=$($proc.ExitCode)" }
            $handle=$proc.MainWindowHandle
            $result.window_handle="0x"+$handle.ToInt64().ToString('X')
            $result.window_title=$proc.MainWindowTitle
            Write-Host "PL9 started=True alive_after_15s=True PID=$($proc.Id) HWND=$($result.window_handle) Title=$($result.window_title)"
            if ($handle -ne [IntPtr]::Zero) {
              $result.window_class=[Pl9WindowsProbe]::Info($handle)
              $kids=New-Object 'System.Collections.Generic.List[string]'
              $kidHandles=New-Object 'System.Collections.Generic.List[System.IntPtr]'
              $cb=[Pl9WindowsProbe+WindowEnumerator] { param($h,$unused) if($kids.Count -lt 80){$kids.Add([Pl9WindowsProbe]::Info($h));$kidHandles.Add($h)}; return $true }
              [Pl9WindowsProbe]::EnumChildWindows($handle,$cb,[IntPtr]::Zero) | Out-Null
              $result.child_count=$kids.Count
              Write-Host "TOP_WINDOW=$($result.window_class)"
              try {
                Add-Type -AssemblyName UIAutomationClient -ErrorAction Stop
                Add-Type -AssemblyName UIAutomationTypes -ErrorAction Stop
                $root = [System.Windows.Automation.AutomationElement]::FromHandle($handle)
                if ($null -ne $root) {
                  $nodes = $root.FindAll([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.Condition]::TrueCondition)
                  Write-Host "PL9_QT_ACCESSIBILITY=$env:QT_ACCESSIBILITY UIA_DESCENDANTS=$($nodes.Count)"
                  $uiElements = [Math]::Min($nodes.Count, 30)
                  for($index=0; $index -lt $uiElements; $index++){
                    $element=$nodes.Item($index)
                    Write-Host "PL9_UIA_NODE[$index]=TYPE:$($element.Current.ControlType.ProgrammaticName); NAME:$($element.Current.Name); ID:$($element.Current.AutomationId)"
                  }
                  $allowed = '^(File|New|Open|Birth Data|Birth Details|Research|Export|Save|OK|Cancel|Edit|Chart|Charts|Dasha|Dasas|Vimshottari)$'
                  $k = 0
                  foreach ($node in $nodes) {
                    if($k -ge 25) { break }
                    $name = $node.Current.Name
                    if($name -match $allowed) {
                      Write-Host "UIA_CMD: $name TYPE=$($node.Current.ControlType.ProgrammaticName)"
                      $k++
                    }
                  }
                }
              } catch {
                Write-Host "PL9_UIA_READ_ONLY_ERROR=$($_.Exception.Message)"
              }
              # Read-only MSAA/IAccessible tree probe; no UI actions are invoked.
              $script:pl9MsaaNodeCount=0
              function Write-Pl9MsaaTree {
                param([Pl9IAccessible]$Accessible,[int]$Depth,[string]$Path)
                if ($Depth -ge 5 -or $script:pl9MsaaNodeCount -ge 100) { return }
                $childCount=0
                try { $childCount=$Accessible.get_accChildCount() } catch { Write-Host "MSAA_CHILDCOUNT_ERROR path=$Path error=$($_.Exception.Message)"; return }
                $limit=[Math]::Min([Math]::Max($childCount,0),60)
                for($childId=1; $childId -le $limit -and $script:pl9MsaaNodeCount -lt 100; $childId++){
                  $childName=''; $childRole=''; $childState=''; $shortcut=''; $defaultAction=''
                  try { $childName=[string]$Accessible.get_accName([object]$childId) } catch {}
                  try { $childRole=[string]$Accessible.get_accRole([object]$childId) } catch {}
                  try { $childState=[string]$Accessible.get_accState([object]$childId) } catch {}
                  try { $shortcut=[string]$Accessible.get_accKeyboardShortcut([object]$childId) } catch {}
                  try { $defaultAction=[string]$Accessible.get_accDefaultAction([object]$childId) } catch {}
                  $script:pl9MsaaNodeCount++
                  Write-Host "MSAA_NODE[$($script:pl9MsaaNodeCount)] DEPTH=$Depth CHILD=$childId ROLE=$childRole NAME=$childName SHORTCUT=$shortcut ACTION=$defaultAction STATE=$childState"
                  $nested=$null
                  try { $nested=$Accessible.get_accChild([object]$childId) } catch {}
                  if ($null -ne $nested -and $nested -is [Pl9IAccessible]) {
                    Write-Pl9MsaaTree -Accessible $nested -Depth ($Depth+1) -Path "$Path/$childId"
                  }
                }
              }
              $msaaTargets=New-Object 'System.Collections.Generic.List[object]'
              $msaaTargets.Add([pscustomobject]@{Handle=$handle;Label='TOP'})
              for($i=0; $i -lt [Math]::Min($kidHandles.Count,20); $i++){
                $msaaTargets.Add([pscustomobject]@{Handle=$kidHandles[$i];Label="CHILD$i"})
              }
              $iid=[guid]'618736E0-3C3D-11CF-810C-00AA00389B71'
              foreach($target in $msaaTargets){
                $objectIds=if($target.Label -eq 'TOP'){@([uint32]4294967292,[uint32]0)}else{@([uint32]4294967292)}
                foreach($objectId in $objectIds){
                  $accessible=$null
                  $localIid=$iid
                  $hr=[Pl9WindowsProbe]::AccessibleObjectFromWindow($target.Handle,$objectId,[ref]$localIid,[ref]$accessible)
                  if($hr -eq 0 -and $null -ne $accessible){
                    $rootName=''; $rootRole=''; $rootCount=0
                    try { $rootName=[string]$accessible.get_accName([object]0) } catch {}
                    try { $rootRole=[string]$accessible.get_accRole([object]0) } catch {}
                    try { $rootCount=$accessible.get_accChildCount() } catch {}
                    Write-Host "MSAA_ROOT=$($target.Label) OBJID=$objectId ROLE=$rootRole NAME=$rootName CHILDREN=$rootCount"
                    if($rootCount -gt 0){ Write-Pl9MsaaTree -Accessible $accessible -Depth 0 -Path $target.Label }
                  } else {
                    Write-Host "MSAA_ROOT=$($target.Label) OBJID=$objectId HRESULT=$hr"
                  }
                }
              }
              Write-Host "MSAA_TOTAL_NODES=$script:pl9MsaaNodeCount"
              Write-Host "WIN32_CHILD_COUNT_AT_LEAST=$($kids.Count)"
              $kids | ForEach-Object { Write-Host "CHILD: $_" }
              $menu=[Pl9WindowsProbe]::GetMenu($handle)
              $result.root_menu_present=($menu -ne [IntPtr]::Zero)
              if($result.root_menu_present){$result.root_menu_items=[Pl9WindowsProbe]::GetMenuItemCount($menu)}
              Write-Host "WIN32_ROOT_MENU=$($result.root_menu_present) ITEMS=$($result.root_menu_items)"
              # Qt custom widgets use a single native window by default.
              # Read-only GUI inspection after native child HWND exposure.
              Write-Host "PL9_QT_NATIVE_WINDOWS=$env:QT_USE_NATIVE_WINDOWS"
              Write-Host "PL9_SESSION_APP=$($proc.SessionId) RUNNER=$([System.Diagnostics.Process]::GetCurrentProcess().SessionId)"
              Write-Host "PL9_GUI_WINDOW_HANDLE=$($result.window_handle) UIA_TREE_OBSERVATION_ONLY=true"
              # One non-destructive OS-level input probe: Alt+F opens the File menu if the Qt menu bar accepts it.
              $focusRequest=[Pl9WindowsProbe]::SetForegroundWindow($handle)
              Start-Sleep -Milliseconds 250
              $foregroundHandle=[Pl9WindowsProbe]::GetForegroundWindow()
              $focusMatch=($foregroundHandle -eq $handle)
              Write-Host "PL9_FOCUS_REQUEST=$focusRequest FOREGROUND_MATCH=$focusMatch"
              if($focusMatch){
                # Official PL7/PL9 menu model: File > New opens the Birth Data form.
                $fileMenu=[Pl9WindowsProbe]::SendAltF()
                Start-Sleep -Milliseconds 500
                $newKey=[Pl9WindowsProbe]::SendKey(0x4E)
                Start-Sleep -Milliseconds 500
                $activateNew=[Pl9WindowsProbe]::SendEnter()
                Write-Host "PL9_FILE_NEW_INPUT_COUNTS altf=$fileMenu n=$newKey enter=$activateNew"
                Start-Sleep -Seconds 3
                Write-Host "PL9_BIRTH_DATA_FORM_PROBE=true"
                $ownedHandles=New-Object 'System.Collections.Generic.List[System.IntPtr]'
                $ownedInfo=New-Object 'System.Collections.Generic.List[string]'
                $ownedCb=[Pl9WindowsProbe+WindowEnumerator] {
                  param($h,$unused)
                  $ownerProcessId=[uint32]0
                  [Pl9WindowsProbe]::GetWindowThreadProcessId($h,[ref]$ownerProcessId) | Out-Null
                  if($ownerProcessId -eq [uint32]$proc.Id -and [Pl9WindowsProbe]::IsWindowVisible($h)){
                    $ownedHandles.Add($h)
                    $ownedInfo.Add("HWND=0x"+$h.ToInt64().ToString('X')+" "+[Pl9WindowsProbe]::Info($h))
                  }
                  return $true
                }
                [Pl9WindowsProbe]::EnumWindows($ownedCb,[IntPtr]::Zero) | Out-Null
                Write-Host "PL9_OWNED_VISIBLE_WINDOWS=$($ownedHandles.Count)"
                $ownedInfo | ForEach-Object { Write-Host "PL9_OWNED_WINDOW: $_" }
                # Capture the main PL9 window and any Qt popup into a compact JPEG for visual inspection.
                try {
                  Add-Type -AssemblyName System.Drawing -ErrorAction Stop
                  $left=[int]::MaxValue; $top=[int]::MaxValue; $right=[int]::MinValue; $bottom=[int]::MinValue
                  foreach($wh in $ownedHandles){
                    $wr=New-Object Pl9Rect
                    if([Pl9WindowsProbe]::GetWindowRect($wh,[ref]$wr)){
                      Write-Host "PL9_WINDOW_RECT HWND=0x$($wh.ToInt64().ToString('X')) L=$($wr.Left) T=$($wr.Top) R=$($wr.Right) B=$($wr.Bottom)"
                      $left=[Math]::Min($left,$wr.Left); $top=[Math]::Min($top,$wr.Top)
                      $right=[Math]::Max($right,$wr.Right); $bottom=[Math]::Max($bottom,$wr.Bottom)
                    }
                  }
                  if($right -gt $left -and $bottom -gt $top){
                    $left=[Math]::Max(0,$left-30); $top=[Math]::Max(0,$top-30)
                    $width=[Math]::Min(1800,$right-$left+60); $height=[Math]::Min(1200,$bottom-$top+60)
                    $bitmap=[System.Drawing.Bitmap]::new($width,$height)
                    $graphics=[System.Drawing.Graphics]::FromImage($bitmap)
                    $stream=[System.IO.MemoryStream]::new()
                    try {
                      $graphics.CopyFromScreen($left,$top,0,0,[System.Drawing.Size]::new($width,$height))
                      $bitmap.Save($stream,[System.Drawing.Imaging.ImageFormat]::Jpeg)
                      $bytes=$stream.ToArray()
                      $b64=[Convert]::ToBase64String($bytes)
                      Write-Host "PL9_SCREENSHOT_BYTES=$($bytes.Length) WIDTH=$width HEIGHT=$height"
                      $chunk=0
                      for($offset=0;$offset -lt $b64.Length;$offset+=3000){
                        $count=[Math]::Min(3000,$b64.Length-$offset)
                        Write-Host "PL9_SCREENSHOT_B64[$chunk]=$($b64.Substring($offset,$count))"
                        $chunk++
                      }
                    } finally {
                      $stream.Dispose(); $graphics.Dispose(); $bitmap.Dispose()
                    }
                  } else {
                    Write-Host "PL9_SCREENSHOT_ERROR=No valid window rectangle"
                  }
                } catch {
                  Write-Host "PL9_SCREENSHOT_ERROR=$($_.Exception.Message)"
                }
                try {
                  $afterRoot=[System.Windows.Automation.AutomationElement]::FromHandle($handle)
                  $afterNodes=$afterRoot.FindAll([System.Windows.Automation.TreeScope]::Descendants,[System.Windows.Automation.Condition]::TrueCondition)
                  Write-Host "PL9_AFTER_FILE_NEW_MAIN_UIA_DESCENDANTS=$($afterNodes.Count)"
                  for($j=0;$j -lt [Math]::Min($afterNodes.Count,30);$j++){
                    $el=$afterNodes.Item($j)
                    Write-Host "PL9_AFTER_FILE_NEW_NODE[$j]=TYPE:$($el.Current.ControlType.ProgrammaticName); NAME:$($el.Current.Name); ID:$($el.Current.AutomationId)"
                  }
                  for($w=0;$w -lt $ownedHandles.Count;$w++){
                    if($ownedHandles[$w] -eq $handle){continue}
                    $otherRoot=[System.Windows.Automation.AutomationElement]::FromHandle($ownedHandles[$w])
                    if($null -ne $otherRoot){
                      $otherNodes=$otherRoot.FindAll([System.Windows.Automation.TreeScope]::Descendants,[System.Windows.Automation.Condition]::TrueCondition)
                      Write-Host "PL9_AFTER_FILE_NEW_WINDOW[$w]_UIA_DESCENDANTS=$($otherNodes.Count)"
                      for($j=0;$j -lt [Math]::Min($otherNodes.Count,15);$j++){
                        $el=$otherNodes.Item($j)
                        Write-Host "PL9_AFTER_ALT_F_WINDOW[$w]_NODE[$j]=TYPE:$($el.Current.ControlType.ProgrammaticName); NAME:$($el.Current.Name); ID:$($el.Current.AutomationId)"
                      }
                    }
                  }
                } catch {
                  Write-Host "PL9_AFTER_ALT_F_UIA_ERROR=$($_.Exception.Message)"
                }
              }
            }
          } catch {
            $result.error=$_.Exception.Message
            Write-Host "PL9_LAUNCH_ERROR=$($result.error)"
            throw
          } finally {
            $result | ConvertTo-Json -Depth 4 | Write-Host
            @(
              '### PL9 — public Windows runner, private binaries not published',
              '',
              '| Check | Observed |',
              '|---|---|',
              "| SHA256 executable | verified |",
              "| Start-Process succeeded | $($result.process_started) |",
              "| Process alive after 15s | $($result.process_alive_after_15s) |",
              "| Top-level HWND | $($result.window_handle) |",
              "| Child HWND count (capped at 80) | $($result.child_count) |",
              "| Win32 root menu exists | $($result.root_menu_present) |",
              "| MSAA nodes exposed | $script:pl9MsaaNodeCount |",
              "| Natal calculations | NOT CALCULATED |",
              "| Transit/Vimshottari | NOT CALCULATED |"
            ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            if ($null -ne $proc) { $proc.Refresh(); if(-not $proc.HasExited){Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue} }
          }

      - name: Set up Python for PL9 API integration
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x86

      - name: Checkout public API source
        uses: actions/checkout@v4

      - name: Install PL9 API dependency and run contract tests on Windows
        working-directory: pl9-api
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m compileall -q .
          python -m unittest -v

      - name: PL9 API Windows integration smoke test
        run: |
          $ErrorActionPreference = 'Stop'
          $apiDir = Join-Path $env:GITHUB_WORKSPACE 'pl9-api'
          $env:PL9_EXE = (Resolve-Path -LiteralPath $env:PL9_EXE).Path
          $geoVision = Split-Path -Parent (Split-Path -Parent $env:PL9_EXE)
          $env:PL9_CHARTS_DIR = Join-Path $geoVision 'GeovisionCharts'
          $env:PL9_EXPORT_DIR = Join-Path (Split-Path -Parent $env:PL9_EXE) 'Export'
          $env:PL9_API_PORT = '10810'
          $env:QT_ACCESSIBILITY = '1'
          $env:QT_USE_NATIVE_WINDOWS = '1'
          $env:PL9_API_KEY = 'pl9-smoke-' + [guid]::NewGuid().ToString('N')
          $stdout = Join-Path $env:RUNNER_TEMP 'pl9-api.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'pl9-api.stderr.log'
          $python = (Get-Command python -ErrorAction Stop).Source
          $server = $null
          try {
            $server = Start-Process -FilePath $python -ArgumentList @('pl9_api.py') -WorkingDirectory $apiDir -PassThru -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            $health = $null
            for ($i = 0; $i -lt 40; $i++) {
              if ($server.HasExited) { throw "PL9 API server exited early. $((Get-Content $stderr -Raw -ErrorAction SilentlyContinue))" }
              try {
                $health = Invoke-RestMethod -Method Get -Uri 'http://127.0.0.1:10810/health' -Headers @{ 'X-API-Key' = $env:PL9_API_KEY } -TimeoutSec 3
                break
              } catch { Start-Sleep -Milliseconds 500 }
            }
            if (-not $health -or -not $health.executable_found) { throw 'PL9 API health check failed or PL9.exe was not found.' }
            Write-Host "PL9_API_HEALTH executable_found=$($health.executable_found) process_running=$($health.process_running)"
            $payload = @{
              birth = @{
                name = 'PL9_API_SMOKE_20261106'
                gender = 'male'
                date = '1977-02-23'
                time = '15:08:00'
                utc_offset_hours = 5
                dst_hours = 0
                longitude_east_deg = 61.9166667
                latitude_north_deg = 56.4
                city = "Kamensk-ural'skiy"
                state = "Sverdlovskaya Oblast'"
                country = 'Russia'
                bd_lookup_mode = 'S'
              }
              open = $true
              calculate = $true
            } | ConvertTo-Json -Depth 6
            try {
              $result = Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:10810/horoscope' -Headers @{ 'X-API-Key' = $env:PL9_API_KEY } -ContentType 'application/json' -Body $payload -TimeoutSec 90
            } catch {
              if ($_.ErrorDetails.Message) {
                $responseText = $_.ErrorDetails.Message
                Write-Host "PL9_API_RESPONSE=$responseText"
                try { $result = $responseText | ConvertFrom-Json -ErrorAction Stop }
                catch { throw "PL9 API error response could not be parsed: $($_.Exception.Message)" }
              } else {
                throw
              }
            }
            if ($null -eq $result) { throw 'PL9 API returned no structured result.' }
            $result | ConvertTo-Json -Depth 12 | Write-Host
            function Write-Pl9ScreenSnapshot {
              param([string]$Label)
              try {
                Add-Type -AssemblyName System.Windows.Forms -ErrorAction Stop
                Add-Type -AssemblyName System.Drawing -ErrorAction Stop
                $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
                $bitmap = [System.Drawing.Bitmap]::new($bounds.Width, $bounds.Height)
                $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
                $stream = [System.IO.MemoryStream]::new()
                try {
                  $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
                  $bitmap.Save($stream, [System.Drawing.Imaging.ImageFormat]::Jpeg)
                  $bytes = $stream.ToArray()
                  $b64 = [Convert]::ToBase64String($bytes)
                  Write-Host "PL9_SCREENSHOT_${Label}_BYTES=$($bytes.Length)"
                  $chunk = 0
                  for ($offset = 0; $offset -lt $b64.Length; $offset += 3000) {
                    $count = [Math]::Min(3000, $b64.Length - $offset)
                    Write-Host "PL9_SCREENSHOT_${Label}_B64[$chunk]=$($b64.Substring($offset, $count))"
                    $chunk++
                  }
                } finally {
                  $stream.Dispose()
                  $graphics.Dispose()
                  $bitmap.Dispose()
                }
              } catch {
                Write-Host "PL9_SCREENSHOT_${Label}_ERROR=$($_.Exception.Message)"
              }
            }
            Write-Pl9ScreenSnapshot -Label 'AFTER_CALCULATION'
            $chart_open_possible = $result.calculation_verified -or (
              $result.operation.open.status -eq 'OPEN_REQUEST_SENT_UNCONFIRMED' -and
              @($result.operation.open.remaining_windows).Count -eq 0
            )
            if ($chart_open_possible) {
              $dashaBody = @{ menu_path = 'Reports->Dashas->Vimshottari' } | ConvertTo-Json -Compress
              try {
                $dashaResult = Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:10810/ui/menu' -Headers @{ 'X-API-Key' = $env:PL9_API_KEY } -ContentType 'application/json' -Body $dashaBody -TimeoutSec 20
                $dashaResult | ConvertTo-Json -Depth 8 | Write-Host
                Start-Sleep -Seconds 2
                Write-Pl9ScreenSnapshot -Label 'VIMSHOTTARI'
              } catch {
                Write-Host "PL9_DASHA_MENU_ERROR=$($_.Exception.Message)"
              }
            }
            # Inspect and clear the actual PL9 modal before trying any report action.
            Add-Type -AssemblyName UIAutomationClient -ErrorAction Stop
            Add-Type -AssemblyName UIAutomationTypes -ErrorAction Stop
            $pl9Process = Get-Process -Name PL9 -ErrorAction Stop | Select-Object -First 1
            $desktopRoot = [System.Windows.Automation.AutomationElement]::RootElement
            $topWindows = $desktopRoot.FindAll([System.Windows.Automation.TreeScope]::Children, [System.Windows.Automation.Condition]::TrueCondition)
            foreach ($top in $topWindows) {
              if ($top.Current.ProcessId -eq $pl9Process.Id) {
                Write-Host "PL9_UIA_TOP title=$($top.Current.Name) type=$($top.Current.ControlType.ProgrammaticName) class=$($top.Current.ClassName) hwnd=$($top.Current.NativeWindowHandle)"
                $nodes = $top.FindAll([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.Condition]::TrueCondition)
                for ($j = 0; $j -lt [Math]::Min($nodes.Count, 100); $j++) {
                  $el = $nodes.Item($j)
                  $rect = $el.Current.BoundingRectangle
                  Write-Host "PL9_UIA[$j] type=$($el.Current.ControlType.ProgrammaticName) name=$($el.Current.Name) id=$($el.Current.AutomationId) class=$($el.Current.ClassName) rect=$($rect.X),$($rect.Y),$($rect.Width),$($rect.Height)"
                }
              }
            }
            # The printout dialog is a descendant window of the Qt main window.
            $printout = $null
            $dialogCondition = New-Object System.Windows.Automation.PropertyCondition(
              [System.Windows.Automation.AutomationElement]::NameProperty, 'User defined printout'
            )
            foreach ($top in $topWindows) {
              if ($top.Current.ProcessId -eq $pl9Process.Id) {
                $printout = $top.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $dialogCondition)
                if ($null -ne $printout) { break }
              }
            }
            if ($null -ne $printout) {
              try {
                $printout.SetFocus()
                $windowPattern = $printout.GetCurrentPattern([System.Windows.Automation.WindowPattern]::Pattern)
                $windowPattern.Close()
                Start-Sleep -Seconds 2
                Write-Host 'PL9_PRINT_DIALOG_CLOSED=true'
              } catch {
                Add-Type -AssemblyName System.Windows.Forms -ErrorAction SilentlyContinue
                [System.Windows.Forms.SendKeys]::SendWait('{ESC}')
                Start-Sleep -Seconds 2
                Write-Host "PL9_PRINT_DIALOG_CLOSE_FALLBACK=$($_.Exception.Message)"
              }
            } else {
              Write-Host 'PL9_PRINT_DIALOG_NOT_FOUND_IN_UIA_TREE=true'
            }
            $desktopRoot = [System.Windows.Automation.AutomationElement]::RootElement
            $topWindows = $desktopRoot.FindAll([System.Windows.Automation.TreeScope]::Children, [System.Windows.Automation.Condition]::TrueCondition)
            foreach ($top in $topWindows) {
              if ($top.Current.ProcessId -eq $pl9Process.Id) {
                Write-Host "PL9_UIA_AFTER_CLOSE title=$($top.Current.Name) type=$($top.Current.ControlType.ProgrammaticName) class=$($top.Current.ClassName)"
                $nodes = $top.FindAll([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.Condition]::TrueCondition)
                for ($j = 0; $j -lt [Math]::Min($nodes.Count, 140); $j++) {
                  $el = $nodes.Item($j)
                  Write-Host "PL9_UIA_AFTER[$j] type=$($el.Current.ControlType.ProgrammaticName) name=$($el.Current.Name) id=$($el.Current.AutomationId) class=$($el.Current.ClassName)"
                }
              }
            }
            Write-Pl9ScreenSnapshot -Label 'AFTER_DIALOG_CLOSE'
            # Inspect the actual Qt menus after closing the unexpected printout modal.
            # The previous keyboard navigation selected the wrong menu; never claim a native export.
            Add-Type -TypeDefinition @'
using System;
using System.Runtime.InteropServices;
using System.Threading;
public static class PL9MenuProbe {
  [DllImport("user32.dll")] public static extern bool SetCursorPos(int x,int y);
  [DllImport("user32.dll")] public static extern void mouse_event(uint flags, uint dx, uint dy, uint data, UIntPtr extraInfo);
  [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hwnd);
  public static void Click(int x,int y) {
    if (!SetCursorPos(x,y)) throw new Exception("SetCursorPos failed");
    Thread.Sleep(200);
    mouse_event(2,0,0,0,UIntPtr.Zero);
    Thread.Sleep(100);
    mouse_event(4,0,0,0,UIntPtr.Zero);
  }
}
'@ -ErrorAction Stop
            [PL9MenuProbe]::SetForegroundWindow($pl9Process.MainWindowHandle) | Out-Null
            Start-Sleep -Seconds 1
            foreach ($menu in @(
              @{ Label='MENU_REPORTS'; X=352; Y=135 },
              @{ Label='MENU_RESEARCH'; X=736; Y=135 },
              @{ Label='MENU_PRINT'; X=676; Y=135 }
            )) {
              [PL9MenuProbe]::Click([int]$menu.X,[int]$menu.Y)
              Start-Sleep -Seconds 1
              Write-Pl9ScreenSnapshot -Label $menu.Label
              [PL9MenuProbe]::Click([int]$menu.X,[int]$menu.Y)
              Start-Sleep -Milliseconds 350
            }
            # Per bundled PL9 manual: Reports > Interpretations > Dasha Interpretations.
            try {
              [PL9MenuProbe]::Click(352,135)
              Start-Sleep -Milliseconds 550
              [PL9MenuProbe]::SetCursorPos(382,205) | Out-Null
              Start-Sleep -Seconds 1
              Write-Pl9ScreenSnapshot -Label 'REPORTS_INTERPRETATIONS_SUBMENU'
              [PL9MenuProbe]::Click(574,276)
              Start-Sleep -Seconds 2
              Write-Pl9ScreenSnapshot -Label 'DASHA_REPORT_PERIOD_BEFORE'
              $desktopRoot = [System.Windows.Automation.AutomationElement]::RootElement
              $periodCondition = [System.Windows.Automation.PropertyCondition]::new(
                [System.Windows.Automation.AutomationElement]::NameProperty, 'Dasha report period'
              )
              $periodDialog = $desktopRoot.FindFirst([System.Windows.Automation.TreeScope]::Descendants,$periodCondition)
              if ($null -ne $periodDialog) {
                $rectangle = $periodDialog.Current.BoundingRectangle
                $dx = [int]$rectangle.X
                $dy = [int]$rectangle.Y
                Write-Host "PL9_DASHA_PERIOD_DIALOG rect=$dx,$dy,$($rectangle.Width),$($rectangle.Height)"
                $controls = $periodDialog.FindAll([System.Windows.Automation.TreeScope]::Descendants,[System.Windows.Automation.Condition]::TrueCondition)
                for ($i=0; $i -lt [Math]::Min($controls.Count,80); $i++) {
                  $el=$controls.Item($i)
                  Write-Host "PL9_DASHA_DIALOG_NODE[$i] type=$($el.Current.ControlType.ProgrammaticName) name=$($el.Current.Name)"
                }
                # Relative coordinates match the PL9 9.0 manual's 302x330 dialog.
                # Enter the five-year period and up to three nested Vimshottari levels.
                [PL9MenuProbe]::Click(($dx+115),($dy+50))
                [System.Windows.Forms.SendKeys]::SendWait('^a')
                [System.Windows.Forms.SendKeys]::SendWait('07:11:2026')
                [PL9MenuProbe]::Click(($dx+26),($dy+236))
                [PL9MenuProbe]::Click(($dx+161),($dy+188))
                Write-Pl9ScreenSnapshot -Label 'DASHA_REPORT_PERIOD_SELECTED'
                [PL9MenuProbe]::Click(($dx+171),($dy+318))
                Start-Sleep -Seconds 4
                Write-Pl9ScreenSnapshot -Label 'DASHA_REPORT_CONTENT'
                try {
                  $clip = Get-Clipboard -Raw -ErrorAction SilentlyContinue
                  [System.Windows.Forms.SendKeys]::SendWait('^a')
                  [System.Windows.Forms.SendKeys]::SendWait('^c')
                  Start-Sleep -Milliseconds 700
                  $newClip = Get-Clipboard -Raw -ErrorAction SilentlyContinue
                  if ($newClip -and $newClip -ne $clip) {
                    Write-Host "PL9_DASHA_REPORT_CLIPBOARD_TEXT_BEGIN"
                    Write-Host $newClip
                    Write-Host "PL9_DASHA_REPORT_CLIPBOARD_TEXT_END"
                  } else { Write-Host 'PL9_DASHA_REPORT_CLIPBOARD_NOT_CONFIRMED' }
                } catch {
                  Write-Host "PL9_DASHA_REPORT_COPY_ERROR=$($_.Exception.Message)"
                }
              } else {
                Write-Host 'PL9_DASHA_REPORT_PERIOD_DIALOG_NOT_FOUND'
              }
            } catch {
              Write-Host "PL9_DASHA_REPORT_NAVIGATION_ERROR=$($_.Exception.Message)"
            }
            if ($result.calculation_verified -and $result.operation.export.matched_chart) {
              Write-Host 'PL9_API_REAL_CALCULATION_VERIFIED=true'
            } else {
              Write-Host 'PL9_API_REAL_CALCULATION_VERIFIED=false; native export did not match; menu diagnosis captured'
            }
          } finally {
            if ($null -ne $server) {
              $server.Refresh()
              if (-not $server.HasExited) { Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue }
            }
            Get-CimInstance Win32_Process -Filter "Name='PL9.exe'" |
              Where-Object { $_.ExecutablePath -eq $env:PL9_EXE } |
              ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
            if (Test-Path $stdout) {
              Get-Content $stdout | Where-Object { $_ -notmatch '^API key \(X-API-Key\):' } | ForEach-Object { Write-Host $_ }
            }
            if (Test-Path $stderr) { Get-Content $stderr | ForEach-Object { Write-Host $_ } }
          }
      - name: Publish run locator and status for automated retrieval
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $status = if ('${{ job.status }}' -eq 'success') { 'success' } else { 'failure' }
          $url = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $payload = @{ state=$status; context='PL9 Windows 15:08'; description="PL9 Windows run: $status"; target_url=$url } | ConvertTo-Json -Compress
          $payload | gh api -X POST "repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA" --input -
# PL9 run: corrected menu-bar offset for Research export and Reports Dashas.
